<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background to make neon pop -->
  <rect width="100" height="100" rx="20" fill="#0f0f13"/>
  
  <!-- Neon glow filter -->
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Calendar Base -->
  <rect x="20" y="30" width="60" height="55" rx="8" fill="none" stroke="#22d3ee" stroke-width="6" filter="url(#neon-glow)"/>
  
  <!-- Calendar Header Line -->
  <line x1="20" y1="48" x2="80" y2="48" stroke="#22d3ee" stroke-width="6" filter="url(#neon-glow)"/>

  <!-- Calendar Rings/Spines -->
  <line x1="32" y1="18" x2="32" y2="38" stroke="#f472b6" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow)"/>
  <line x1="68" y1="18" x2="68" y2="38" stroke="#f472b6" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow)"/>

  <!-- Checkmark / Sync indication inside calendar -->
  <path d="M 40 65 L 50 75 L 65 55" fill="none" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)"/>
</svg>
